<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chiemsee Online Shop · Boardsport seit 1982</title>
  <meta name="description" content="Chiemsee Online Shop. Sweatshirts, Fleece, Skibekleidung, Bademode und Accessoires für Damen, Herren und Kinder. Seit 1982 am Wasser.">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="preload" href="./fonts/HankenGrotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/campaign/fall-women-hoodie.jpg" as="image">
  <script type="module" crossorigin src="./assets/main-Zi7N11vR.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/search-Dn7CA41L.js">
  <link rel="stylesheet" crossorigin href="./assets/search-ip9YPQe9.css">
  <link rel="stylesheet" crossorigin href="./assets/main-CtSsCz3b.css">
</head>
<body>
  <div id="chrome-top"></div>
  <main id="main">
    <!-- chiemsee.com's campaign hero, carried over slide for slide. Their type
         but in the store's own type and palette. The slider auto-advances. -->
    <section class="cs-hero" aria-label="Chiemsee Kampagne" aria-roledescription="carousel" data-hero>
      <h1 class="sr-only">Chiemsee · Boardsport seit 1982</h1>

      <article class="cs-slide is-active" data-slide aria-roledescription="slide" aria-label="1 von 3">
        <img src="./assets/campaign/fall-women-hoodie.jpg" alt="Frau in grauem Chiemsee Hoodie mit Kamera am Seeufer" width="1920" height="920" fetchpriority="high">
        <div class="cs-scrim" aria-hidden="true"></div>
        <div class="cs-copy">
          <span class="cs-brand t-s">Chiemsee</span>
          <span class="cs-word t-hero">Fall Essentials</span>
          <a class="btn btn-paper" href="shop.html">Neu entdecken</a>
        </div>
      </article>

      <article class="cs-slide" data-slide aria-roledescription="slide" aria-label="2 von 3">
        <img src="./assets/campaign/fall-men-troyer.jpg" alt="Mann im Chiemsee Troyer vor herbstlicher Landschaft" width="1920" height="920" loading="lazy">
        <div class="cs-scrim" aria-hidden="true"></div>
        <div class="cs-copy">
          <span class="cs-brand t-s">Chiemsee</span>
          <span class="cs-word t-hero">Troyer</span>
          <a class="btn btn-paper" href="shop.html?cat=herren&amp;type=Sweatshirts%20%26%20Hoodies">Troyer ansehen</a>
        </div>
      </article>

      <article class="cs-slide" data-slide aria-roledescription="slide" aria-label="3 von 3">
        <img src="./assets/campaign/fall-men-fleece.jpg" alt="Mann in schwarzer Chiemsee Sherpa-Fleecejacke vor einer Holzhuette" width="1920" height="920" loading="lazy">
        <div class="cs-scrim" aria-hidden="true"></div>
        <div class="cs-copy">
          <span class="cs-brand t-s">Chiemsee</span>
          <span class="cs-word t-hero">Fleece</span>
          <a class="btn btn-paper" href="shop.html?cat=herren&amp;type=Fleece">Fleece ansehen</a>
        </div>
      </article>

      <div class="cs-arrows">
        <button type="button" data-prev aria-label="Vorheriger Slide">&larr;</button>
        <button type="button" data-next aria-label="Naechster Slide">&rarr;</button>
      </div>
      <div class="cs-dots" data-dots>
        <button type="button" class="is-active" data-dot="0" aria-label="Slide 1">01</button>
        <button type="button" data-dot="1" aria-label="Slide 2">02</button>
        <button type="button" data-dot="2" aria-label="Slide 3">03</button>
      </div>
    </section>

    <section class="entries" aria-label="Kategorien">
      <a class="entry" href="shop.html?cat=damen"><span class="entry-media"><img src="./assets/products/3326213/chiemsee-3326213-90-a.jpg" alt="" width="1200" height="1714"></span><span class="t-m upper">Damen</span></a>
      <a class="entry" href="shop.html?cat=herren"><span class="entry-media"><img src="./assets/products/3326232/chiemsee-3326232-18-4718-a.jpg" alt="" width="1200" height="1714"></span><span class="t-m upper">Herren</span></a>
      <a class="entry" href="shop.html?cat=kinder"><span class="entry-media flat"><img src="./assets/products/00014307/chiemsee-00014307-18-3513-a.jpg" alt="" width="1200" height="1714"></span><span class="t-m upper">Kinder</span></a>
    </section>

    <section class="row-sec" aria-labelledby="h-new">
      <div class="row-head"><h2 class="t-l" id="h-new">Neu eingetroffen</h2><a class="t-m" href="shop.html">Alle ansehen</a></div>
      <div class="grid" data-row="new"></div>
    </section>

    <section class="band" aria-label="Herbst 2026">
      <img src="./assets/campaign/fall-men-fleece.jpg" alt="Mann in schwarzer Chiemsee Sherpa-Fleecejacke vor einer Holzhütte" loading="lazy" width="1920" height="920">
      <div class="band-copy">
        <h2 class="t-l">Vom See auf den Berg.</h2>
        <a class="btn btn-paper btn-sm" href="shop.html?cat=herren&type=Sweatshirts%20%26%20Hoodies">Troyer und Sweats</a>
      </div>
    </section>

    <section class="row-sec" aria-labelledby="h-sale">
      <div class="row-head"><h2 class="t-l" id="h-sale">Sale</h2><a class="t-m" href="shop.html?cat=sale">Alle reduzierten Artikel</a></div>
      <div class="grid" data-row="sale"></div>
    </section>
  </main>
  <div id="chrome-bottom"></div>
</body>
</html>
